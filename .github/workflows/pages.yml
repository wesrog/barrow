name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test sim client net signal
      # The licensed art isn't in git: fetch the pack assets.lock.json names from the
      # private bucket into public/ so the build ships it. The runner's AWS CLI reads
      # the keys from the environment; the pull fails the job rather than deploy without art.
      - name: Fetch the asset pack
        if: hashFiles('assets.lock.json') != ''
        run: bun run assets:pull
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - run: bun run build
        env:
          GITHUB_PAGES: "true"
          VITE_SIGNAL_URL: "wss://barrow-signal.fly.dev"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
